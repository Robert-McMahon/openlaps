# The pit follows the vehicle SBC so source and receive clocks share a reference.
server 192.168.12.176 iburst prefer minpoll 4 maxpoll 6

# Garage fallback when the vehicle is offline.
pool pool.ntp.org iburst maxsources 4
makestep 1.0 3

# The vehicle serves `local stratum 10`, so it keeps answering while
# free-running without a GPS fix, and a cold SBC has no RTC to free-run from.
# `makestep` would apply whatever time that source offers. The pit has an RTC
# and an internet fallback, so an offset this large means the source is wrong,
# not the pit: check from the first update (0) rather than allowing one large
# startup correction, ignore the sample, and never exit over it (-1).
maxchange 1000 0 -1

rtcsync

driftfile /var/lib/chrony/drift
logdir /var/log/chrony
