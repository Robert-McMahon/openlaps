# BBR congestion control for the vehicle-to-pit TCP link (the NATS leafnode,
# over HaLow or Starlink). Needs a kernel built with the openlaps.config
# fragment (CONFIG_TCP_CONG_BBR=y, CONFIG_NET_SCH_FQ=y); the stock vendor
# kernel has only cubic and reno, and on it this file is ignored with a
# one-line sysctl error at boot.
#
# Install:  sudo install -m 0644 deploy/targets/luckfox-omni3576/systemd/90-openlaps-bbr.conf /etc/sysctl.d/
# Apply:    sudo sysctl --system
# Check:    sysctl net.ipv4.tcp_congestion_control   # bbr
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
