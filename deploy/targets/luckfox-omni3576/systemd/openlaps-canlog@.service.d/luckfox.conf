# Luckfox Omni3576 drop-in for deploy/systemd/openlaps-canlog@.service.
#
# The shipped unit assumes the capture root is /mnt/data/captures; on this
# board the NVMe is mounted at /srv/openlaps (README.md -> Storage), and
# can0 must come up in FD mode or the controller refuses the bitrate
# (README.md -> CAN: FD mode is mandatory). Install beside the unit:
#
#     sudo install -D -m 0644 deploy/systemd/openlaps-canlog@.service \
#       /etc/systemd/system/openlaps-canlog@.service
#     sudo install -D -m 0644 \
#       deploy/targets/luckfox-omni3576/systemd/openlaps-canlog@.service.d/luckfox.conf \
#       /etc/systemd/system/openlaps-canlog@.service.d/luckfox.conf
#     echo OPENLAPS_RAW_CAPTURE_DIR=/srv/openlaps/captures | sudo tee -a /etc/openlaps/agent.env
#     sudo systemctl daemon-reload && sudo systemctl enable --now openlaps-canlog@can0
#
# Keep OPENLAPS_RAW_CAPTURE_DIR, the install -d below and ReadWritePaths
# pointing at the same directory.
[Service]
ExecStartPre=
ExecStartPre=-/sbin/ip link set %i up type can bitrate 1000000 dbitrate 2000000 fd on
ExecStartPre=+/usr/bin/install -d -o openlaps -g openlaps /srv/openlaps/captures
ReadWritePaths=/srv/openlaps/captures
