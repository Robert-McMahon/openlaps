apiVersion: 1
groups:
- orgId: 1
  name: openlaps-endurance
  folder: openlaps
  interval: 10s
  rules:
  - uid: oil-pressure-low
    title: Oil pressure low against RPM
    condition: C
    for: 15s
    noDataState: OK
    execErrState: Error
    annotations:
      dashboardUID: reliability
      panelID: '1'
      runbook_url: /d/reliability/reliability?var-alert=oil-pressure-low
      summary: Oil pressure low against RPM
    labels:
      service: openlaps
      scope: on track
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: timescale
      model:
        datasource: &id001
          type: grafana-postgresql-datasource
          uid: timescale
        editorMode: code
        format: time_series
        instant: true
        rawQuery: true
        rawSql: SELECT now() AS "time", CASE WHEN COALESCE((SELECT value_text::jsonb
          ->> 'pit_status' FROM v_samples_named WHERE vehicle_id = 'example-club-racer'
          AND channel = 'lap.event' AND value_text IS NOT NULL ORDER BY time DESC
          LIMIT 1), 'track') = 'track' AND COALESCE((SELECT value FROM v_samples_named
          WHERE vehicle_id = 'example-club-racer' AND channel = 'car.rpm' AND value
          IS NOT NULL ORDER BY time DESC LIMIT 1), 0) >= 2000 THEN COALESCE((SELECT
          value FROM v_samples_named WHERE vehicle_id = 'example-club-racer' AND channel
          = 'car.oil_pressure' AND value IS NOT NULL ORDER BY time DESC LIMIT 1),
          10000) ELSE 10000 END AS "value"
        refId: A
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: '-100'
      model:
        conditions: []
        datasource:
          type: __expr__
          uid: '-100'
        expression: A
        reducer: last
        refId: B
        type: reduce
    - refId: C
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: '-100'
      model:
        conditions:
        - evaluator:
            params:
            - 200
            type: lt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: '-100'
        expression: B
        refId: C
        type: threshold
