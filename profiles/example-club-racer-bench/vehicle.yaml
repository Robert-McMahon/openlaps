# profiles/example-club-racer-bench/vehicle.yaml
#
# Bench profile (Phase 4, P4.1): the example car with its two live inputs
# repointed at the bench's synthetic ones, so the vehicle agent under test
# is the real agent reading real interfaces -- the injection point sits
# *below* the agent, at the socketCAN and serial boundaries
# (docs/plan/PHASE4.md, locked decision 4).
#
# `catalog.yaml`, `dbcs/` and `tracks/` are byte-identical copies of the
# example profile's and must stay that way -- the bench measures the real
# channel mix or it measures nothing. `tests/test_bench_profile.py` enforces
# the byte-identity and the resulting registry equivalence, so drift fails
# CI rather than quietly changing what a bench run means.
#
# Only this file differs from profiles/example-club-racer/vehicle.yaml; see
# README.md in this directory for the two deltas and why each is shaped the
# way it is. No secrets live here, same as the example profile.

vehicle:
  id: example-club-racer

buses:
  # `name` is what catalog `from: "can0:..."` references resolve against and
  # `interface` is the socketCAN device actually opened -- independent
  # fields (src/core/config.py), so pointing the bench at vcan0 leaves all
  # 123 catalog entries untouched.
  - name: can0
    interface: vcan0
    bitrate: 1000000
    dbcs:
      - device: haltech
        file: dbcs/haltech-ecu.dbc
      - device: haltech2
        file: dbcs/haltech-multiplexed.dbc
      - device: wideband
        file: dbcs/haltech-wideband.dbc
      - device: imu
        file: dbcs/fdi-imu.dbc

serial:
  # The pty that tools/bench_gps.py publishes at a stable symlink. The
  # `um980` driver block is kept -- with `configure_on_start: false` so it
  # never talks to a receiver that is not there -- for two reasons:
  #   1. Serial source references resolve `<serial>:<driver>` when a driver
  #      is attached and `<serial>:<decoder>` when one is not, so dropping
  #      the block would invalidate every `from: "serial0:um980.RMC.*"`
  #      entry and force a catalog edit -- exactly what must not happen.
  #   2. An attached driver is what makes the collector accept RTCM
  #      write-back from the pit ntrip-client. Removing it would delete
  #      pit->vehicle correction traffic from the measured reverse channel,
  #      which is the one direction docs/LINK_BUDGET.md §8 has never
  #      measured and P4.3 exists to measure.
  - name: serial0
    port: /tmp/openlaps-bench-gps
    baud: 115200
    decoder: nmea
    driver:
      name: um980
      config:
        rate_hz: 50
        sentences: [RMC]
        configure_on_start: false

host:
  enabled: true
  interval: 5s
