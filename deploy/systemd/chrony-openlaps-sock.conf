# Make chronyd-created refclock sockets group-writable by the openlaps shim.
# Ubuntu's packaged unit starts chronyd through a privileged (!) command, so
# set the startup GID explicitly before chronyd creates the socket and drops to
# its configured unprivileged user.
[Service]
Group=openlaps
ExecStart=
ExecStart=!/usr/bin/setpriv --regid=openlaps --clear-groups /usr/lib/systemd/scripts/chronyd-starter.sh $DAEMON_OPTS
UMask=0117
RuntimeDirectoryMode=0750
