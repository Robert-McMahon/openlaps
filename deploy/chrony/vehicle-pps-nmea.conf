# Vehicle clock for a board with a kernel PPS device *and* an agent that
# feeds chrony the receiver's own time (OPENLAPS_CHRONY_NMEA_SOCKET).
#
#     sudo install -m 0644 deploy/chrony/vehicle-pps-nmea.conf /etc/chrony/chrony.conf
#
# This is `vehicle-pps.conf` with the PPS paired to a coarse source. A PPS
# edge says when a second starts, never which second it is. In
# `vehicle-pps.conf` that comes from the internet pool, which a car at a
# track does not have: the whole second is then whatever the RTC said at
# boot (a Luckfox ran a whole 12 s fast, PPS locked, on 2026-11-10), and
# chrony labels an unpaired PPS selected under `local` as stratum 10 for
# good. Here the agent sends one sample a second from the top-of-second RMC
# (src/collectors/serial/gnss_time.py), so both are right with no network.
# `tests/test_timing_deploy.py` holds the common lines in step.
pool pool.ntp.org iburst maxsources 4

# The coarse second. `noselect`: serial timing is tens of milliseconds of
# jitter and is never the clock, it only numbers the pulses below.
# `offset` is the serial latency -- how long after the second the RMC that
# names it arrives -- so the sample lands on the right pulse with margin on
# both sides. The agent logs the measured figure on its first sample
# ("clock +NN ms from RMC"); with chrony already locked, that is the number.
# The socket lives outside /run/chrony because that directory is closed to
# the agent's user; deploy/systemd/chrony-openlaps-nmea.conf creates it.
refclock SOCK /run/openlaps-chrony/nmea.sock refid NMEA precision 1e-2 offset 0.050 delay 0.2 noselect

# `lock NMEA`: each pulse is numbered by the sample above. No NMEA -- agent
# stopped, receiver without a fix -- means no PPS samples either, and chrony
# falls back to the pool, then to free-running on the drift file.
refclock PPS /dev/pps0 refid GPS lock NMEA precision 1e-6 prefer

# A cold SBC may have no RTC. Only early startup corrections may step;
# source loss/restoration after that is handled by chrony's normal slew.
makestep 1.0 3
rtcsync

# Continue serving the pit while free-running if every real source disappears.
local stratum 10
allow 192.168.12.0/24

driftfile /var/lib/chrony/drift
logdir /var/log/chrony
