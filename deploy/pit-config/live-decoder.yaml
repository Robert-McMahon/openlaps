# Pit-side live gauge selection. First matching rule wins; an unmatched
# channel is not published. Editing this file is picked up without a restart.
#
# `vehicle` is the subject filter: the service consumes tele.<vehicle>.> and
# publishes to openlaps/<vehicle>/<channel>. It must equal the pit's
# OPENLAPS_VEHICLE_ID -- the other three pit services read that variable
# directly, and this one refuses to start if the two disagree, because a
# mismatch is otherwise indistinguishable from a car that never moved.
vehicle: example-club-racer

defaults:
  max_hz: 10          # per-channel ceiling; 0 means unlimited
  total_max_hz: 500   # aggregate safety valve; 0 means unlimited

channels:
  - match: "position.*"
  - match: "car.rpm"
    max_hz: 20
  - match: "car.accel_*"
    max_hz: 5
  - match: "car.coolant_temp"
    max_hz: 1
  - match: "lap.*"
    max_hz: 0          # rare events: publish every one
  - match: "timing.*"
  - match: "sys.agent.status"
    max_hz: 1
