# Vehicle clock: RP2040/UM980 is preferred; internet NTP is ordinary fallback.
pool pool.ntp.org iburst maxsources 4
refclock SOCK /run/chrony/openlaps-timing.sock refid GPS precision 1e-4 prefer

# A cold SBC may have no RTC. Only early startup corrections may step;
# source loss/restoration after that is handled by chrony's normal slew.
makestep 1.0 3
rtcsync

# Continue serving the pit while free-running if every real source disappears.
local stratum 10
allow 192.168.12.0/24

driftfile /var/lib/chrony/drift
logdir /var/log/chrony
