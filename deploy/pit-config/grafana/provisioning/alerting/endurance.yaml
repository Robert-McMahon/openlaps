contactPoints:
- orgId: 1
  name: openlaps-local
  receivers:
  - uid: openlaps-local-webhook
    type: webhook
    settings:
      # session-control, by its compose service name. This ran as
      # 127.0.0.1:8080 until 2026-08-29, which inside the grafana container
      # is the grafana container -- nothing listens there, so every
      # notification failed with "connection refused" once a minute for as
      # long as a rule was firing. The receiver itself is unauthenticated by
      # design; see POST /grafana-alerts in pit/session_control/service.py
      # for why the operator API key deliberately does not appear in this
      # committed file.
      url: http://session-control:8080/grafana-alerts
      httpMethod: POST
    disableResolveMessage: false
policies:
- orgId: 1
  receiver: openlaps-local
  group_by:
  - grafana_folder
  - alertname
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
