gps:
  heading: {channel: position.heading, units: "deg", type: double}
  lat: {channel: position.lat, units: "deg", type: double}
  lon: {channel: position.lon, units: "deg", type: double}
  # pyubx2 stored the old RMC speed in knots; the canonical channel is km/h.
  speed: {channel: position.speed, units: "km/h", type: double, factor: 1.852}

system:
  telemetry/system/radx4/cpu/0: {channel: sys.host.cpu_percent.0, units: "%", type: double}
  telemetry/system/radx4/cpu/1: {channel: sys.host.cpu_percent.1, units: "%", type: double}
  telemetry/system/radx4/cpu/2: {channel: sys.host.cpu_percent.2, units: "%", type: double}
  telemetry/system/radx4/cpu/3: {channel: sys.host.cpu_percent.3, units: "%", type: double}
  telemetry/system/radx4/virtual_memory: {channel: sys.host.mem_percent, units: "%", type: double}
  telemetry/system/radx4/swap_memory/percent: {channel: sys.host.swap_percent, units: "%", type: double}
  telemetry/system/radx4/swap_memory/used: {channel: sys.host.swap_used_bytes, units: "bytes", type: int}
  telemetry/system/radx4/swap_memory/free: {channel: sys.host.swap_free_bytes, units: "bytes", type: int}
  telemetry/system/radx4/swap_memory/total: {channel: sys.host.swap_total_bytes, units: "bytes", type: int}
  telemetry/system/radx4/swap_memory/sin: {channel: sys.host.swap_in_bytes, units: "bytes", type: int}
  telemetry/system/radx4/swap_memory/sout: {channel: sys.host.swap_out_bytes, units: "bytes", type: int}
  telemetry/system/psmqtt_status/num_mqtt_disconnects: {channel: sys.legacy.mqtt_disconnects, units: "", type: int}
  telemetry/system/psmqtt_status/num_tasks_errors: {channel: sys.legacy.task_errors, units: "", type: int}
  telemetry/system/psmqtt_status/num_tasks_success: {channel: sys.legacy.task_success, units: "", type: int}

# Deliberately absent from `can`: these names must be reported as unmapped.
unmapped:
  - GEARBOX_TEMPERATURE  # stale; no matching DBC signal
  - PD16A_*_PIN_STATE
  - PD16A_*_RETRY_COUNT
  - PD16A_HCO*_VOLTAGE
  - PD16A_HCO*_CURRENT
  - PD16A_HCO*_LOAD
  - PD16A_HBO_*_VOLTAGE
  - PD16A_HBO_*_HS_CURRENT
  - PD16A_HBO_*_LOAD
  - PD16A_AVI_*_STATE
  - PD16A_AVI_*_VOLTAGE
  - PD16A_SPI_3_STATE
  - PD16A_SPI_4_STATE
  - PD16A_SPI_3_VOLTAGE
  - PD16A_SPI_4_VOLTAGE
