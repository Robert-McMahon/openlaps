# profiles/example-club-racer/catalog.yaml
#
# Channel catalog for the example profile: maps every source-native CAN
# signal and serial/GNSS field this car currently records to a canonical
# channel name. See docs/CATALOG.md for the schema, naming convention, and
# the full old-config -> canonical coverage table.
#
# `from` addresses a source signal as "<bus-or-serial>:<device>.<MESSAGE>.<SIGNAL>"
# (CAN) or "<serial>:<driver>.<SENTENCE>.<field>" (serial) or "host:<metric>".
# `units` is the physical unit as decoded (kept as reported by the DBC/decoder;
# note the Haltech ECU reports temperatures in Kelvin while the FDI IMU reports
# its own board temperature in Celsius -- a real-world inconsistency this catalog
# deliberately does not paper over, since consumers should read `units`, not assume).
# `type` defaults to double; set explicitly for bool/int/string channels.
# `rbe` (report-by-exception) is a link/store filter: {deadband, min_interval,
# max_interval}. It never applies to the timing engine's pre-RBE tap.
# `live_hz` is a decimation hint for the pit live-decoder (MQTT-Live panels),
# independent of the RBE policy used for the durable JetStream/Timescale path.

channels:

  # ---- engine.* -- Haltech ECU (device: haltech) + WB1 CAN wideband (device: wideband) ----
  engine.air_temp: { from: "can0:haltech.TEMPERATURE1.AIR_TEMPERATURE", units: "K" }
  engine.ambient_air_temp: { from: "can0:haltech.AMBIENT.AMBIENT_AIR_TEMPERATURE", units: "K" }
  engine.baro_pressure: { from: "can0:haltech.MISC4.BAROMETRIC_PRESSURE", units: "kPa" }
  engine.boost_control_output: { from: "can0:haltech.PWM_OUTPUT.BOOST_CONTROL_OUTPUT", units: "%" }
  engine.calculated_air_temp: { from: "can0:haltech.MISC14.CALCULATED_AIR_TEMPERATURE", units: "K" }
  engine.check_engine_light: { from: "can0:haltech.MISC5.CHECK_ENGINE_LIGHT", type: bool }
  engine.coolant_pressure: { from: "can0:haltech.ENGINE1.COOLANT_PRESSURE", units: "kPa" }
  engine.coolant_temp: { from: "can0:haltech.TEMPERATURE1.COOLANT_TEMPERATURE", units: "K" }
  engine.demand: { from: "can0:haltech.ENGINE2.ENGINE_DEMAND", units: "%" }
  engine.ecu_temp: { from: "can0:haltech.ECU_TEMPERATURE.ECU_TEMPERATURE", units: "K" }
  engine.exhaust_manifold_pressure: { from: "can0:haltech.MISC11.EXHAUST_MANIFOLD_PRESSURE", units: "kPa" }
  engine.fuel_pressure: { from: "can0:haltech.ENGINE2.FUEL_PRESSURE", units: "kPa" }
  engine.fuel_temp: { from: "can0:haltech.TEMPERATURE1.FUEL_TEMPERATURE", units: "K" }
  engine.gear: { from: "can0:haltech.MISC10.GEAR", type: int }
  engine.gearbox_oil_temp: { from: "can0:haltech.TEMPERATURE2.GEARBOX_OIL_TEMPERATURE", units: "K" }
  engine.ignition_angle_bank1: { from: "can0:haltech.MISC9.IGNITION_ANGLE_BANK1", units: "°" }
  engine.ignition_angle_bank2: { from: "can0:haltech.MISC9.IGNITION_ANGLE_BANK2", units: "°" }
  engine.ignition_angle_leading: { from: "can0:haltech.ENGINE3.IGNITION_ANGLE_LEADING", units: "°" }
  engine.injection_stage1_avg_time: { from: "can0:haltech.INJECTION_TIME.INJECTION_STAGE1_AVG_TIME", units: "ms" }
  engine.injection_stage1_duty: { from: "can0:haltech.ENGINE3.INJECTION_STAGE1_DUTY_CYCLE", units: "%" }
  engine.injector_pressure_diff: { from: "can0:haltech.MISC11.INJECTOR_PRESSURE_DIFFERENTIAL", units: "kPa" }
  engine.knock_level1: { from: "can0:haltech.KNOCK.KNOCK_LEVEL1", units: "dB" }
  engine.knock_level2: { from: "can0:haltech.KNOCK.KNOCK_LEVEL2", units: "dB" }
  engine.lambda1: { from: "can0:haltech.WIDEBAND1.LAMBDA_SENSOR1", units: "λ" }
  engine.lambda_overall: { from: "can0:haltech.MISC10.LAMBDA_OVERALL", units: "λ" }
  engine.launch_control_active: { from: "can0:haltech.MISC5.LAUNCH_CONTROL_ACTIVE", type: bool }
  engine.launch_control_ign_retard: { from: "can0:haltech.MISC2.LAUNCH_CONTROL_IGNITION_RETARD", units: "°" }
  engine.limiting_active: { from: "can0:haltech.MISC2.ENGINE_LIMITING_ACTIVE", type: bool }
  engine.map: { from: "can0:haltech.ENGINE1.MANIFOLD_PRESSURE", units: "kPa" }
  engine.oil_pressure: { from: "can0:haltech.ENGINE2.OIL_PRESSURE", units: "kPa" }
  engine.oil_pressure_light: { from: "can0:haltech.MISC5.OIL_PRESSURE_LIGHT", type: bool }
  engine.oil_temp: { from: "can0:haltech.TEMPERATURE1.OIL_TEMPERATURE", units: "K" }
  engine.protection_reason_letter: { from: "can0:haltech.MISC13.ENGINE_PROTECTION_REASON_LETTER", type: int }
  engine.protection_reason_number: { from: "can0:haltech.MISC13.ENGINE_PROTECTION_REASON_NUMBER", type: int }
  engine.protection_severity: { from: "can0:haltech.MISC13.ENGINE_PROTECTION_SEVERITY_LEVEL", type: int }
  engine.rpm: { from: "can0:haltech.ENGINE1.ENGINE_SPEED", units: "RPM" }
  engine.target_boost: { from: "can0:haltech.MISC4.TARGET_BOOST_LEVEL", units: "kPa" }
  engine.target_lambda: { from: "can0:haltech.GENERIC3.TARGET_LAMBDA", units: "λ" }
  engine.throttle_pos: { from: "can0:haltech.ENGINE1.THROTTLE_POSITION", units: "%" }
  engine.trigger_counter: { from: "can0:haltech.TRIGGER.TRIGGER_COUNTER", type: int }
  engine.trigger_error_count: { from: "can0:haltech.TRIGGER.TRIGGER_SYSTEM_ERROR_COUNT", type: int }
  engine.trigger_sync_level: { from: "can0:haltech.TRIGGER.TRIGGER_SYNC_LEVEL", type: int }
  engine.wastegate_pressure: { from: "can0:haltech.ENGINE2.WASTEGATE_PRESSURE", units: "kPa" }
  engine.wb1_diagnostic1: { from: "can0:wideband.WB1_LAMBDA.WB1_DIAGNOSTIC_1", type: int }
  engine.wb1_lambda1: { from: "can0:wideband.WB1_LAMBDA.WB1_LAMBDA_1", units: "lambda" }
  engine.wb1_sense_resistor1: { from: "can0:wideband.WB1_LAMBDA.WB1_SENSE_RESISTOR_1", units: "ohm" }

  # ---- chassis.* -- FDI DETA10A IMU (device: imu) + driver-input switches from the ECU ----
  chassis.accel_pedal_pos: { from: "can0:haltech.MISC11.ACCELERATOR_PEDAL_POSITION", units: "%" }
  chassis.accel_x: { from: "can0:imu.FDI_IMU_ACCEL.IMU_ACCEL_X", units: "g", live_hz: 10 }
  chassis.accel_y: { from: "can0:imu.FDI_IMU_ACCEL.IMU_ACCEL_Y", units: "g", live_hz: 10 }
  chassis.accel_z: { from: "can0:imu.FDI_IMU_ACCEL.IMU_ACCEL_Z", units: "g", live_hz: 10 }
  chassis.brake_pedal_switch: { from: "can0:haltech.MISC5.BRAKE_PEDAL_SWITCH", type: bool }
  chassis.clutch_switch: { from: "can0:haltech.MISC5.CLUTCH_SWITCH", type: bool }
  chassis.gyro_x: { from: "can0:imu.FDI_IMU_GYRO.IMU_GYRO_X", units: "deg/s", live_hz: 10 }
  chassis.gyro_y: { from: "can0:imu.FDI_IMU_GYRO.IMU_GYRO_Y", units: "deg/s", live_hz: 10 }
  chassis.gyro_z: { from: "can0:imu.FDI_IMU_GYRO.IMU_GYRO_Z", units: "deg/s", live_hz: 10 }
  chassis.imu_temp: { from: "can0:imu.FDI_IMU_INFO.IMU_TEMPERATURE", units: "C" }
  chassis.pitch: { from: "can0:imu.FDI_UKF_EULER.IMU_PITCH", units: "deg", live_hz: 10 }
  chassis.roll: { from: "can0:imu.FDI_UKF_EULER.IMU_ROLL", units: "deg", live_hz: 10 }
  chassis.tc_active: { from: "can0:haltech.MISC5.TRACTION_CONTROL_ACTIVE", type: bool }
  chassis.tc_enabled: { from: "can0:haltech.MISC5.TRACTION_CONTROL_ENABLED", type: bool }
  chassis.yaw: { from: "can0:imu.FDI_UKF_EULER.IMU_YAW", units: "deg", live_hz: 10 }

  # ---- wheels.* -- wheel-speed sensors + ECU-derived vehicle/driveline speed ----
  wheels.driveshaft_rpm: { from: "can0:haltech.MISC6.DRIVESHAFT_RPM", units: "RPM" }
  wheels.speed_fl: { from: "can0:haltech.WHEEL_SPEED.WHEEL_SPEED_FRONT_LEFT", units: "km/h" }
  wheels.speed_fr: { from: "can0:haltech.WHEEL_SPEED.WHEEL_SPEED_FRONT_RIGHT", units: "km/h" }
  wheels.speed_rl: { from: "can0:haltech.WHEEL_SPEED.WHEEL_SPEED_REAR_LEFT", units: "km/h" }
  wheels.speed_rr: { from: "can0:haltech.WHEEL_SPEED.WHEEL_SPEED_REAR_RIGHT", units: "km/h" }
  wheels.trip_distance_m: { from: "can0:haltech.TRIP_METER.DISTANCE_TRIP_METER1", units: "m" }
  wheels.vehicle_speed: { from: "can0:haltech.MISC3.VEHICLE_SPEED", units: "km/h" }

  # ---- fuel.* -- fuel system ----
  fuel.flow_rate: { from: "can0:haltech.FUEL_FLOW.FUEL_FLOW", units: "cc/min" }
  fuel.level: { from: "can0:haltech.FUEL_LEVEL.FUEL_LEVEL", units: "L" }
  fuel.primary_pump_output: { from: "can0:haltech.MISC12.PRIMARY_FUEL_PUMP_OUTPUT", type: bool }
  fuel.total_used: { from: "can0:haltech.MISC12.TOTAL_FUEL_USED", units: "cc" }
  fuel.trim_long_term_bank1: { from: "can0:haltech.FUEL_TRIM.FUEL_TRIM_LONG_TERM_BANK1", units: "%" }
  fuel.trip_used: { from: "can0:haltech.TRIP_METER.TOTAL_FUEL_USED_TRIP_METER1", units: "cc" }

  # ---- electrics.* -- battery, lights, wideband controller supply, PDM raw diagnostic bytes ----
  electrics.battery_v: { from: "can0:haltech.MISC4.BATTERY_VOLTAGE", units: "Volts" }
  electrics.generic_output_states: { from: "can0:haltech.MISC14.GENERIC_OUTPUT_STATES", type: int }
  electrics.head_light: { from: "can0:haltech.VEHICLE_LIGHTS_DATA.HEAD_LIGHT_STATE", type: bool }
  electrics.high_beam_light: { from: "can0:haltech.VEHICLE_LIGHTS_DATA.HIGH_BEAM_LIGHT_STATE", type: bool }
  electrics.left_indicator: { from: "can0:haltech.VEHICLE_LIGHTS_DATA.LEFT_INDICATOR_STATE", type: bool }
  electrics.park_light: { from: "can0:haltech.VEHICLE_LIGHTS_DATA.PARK_LIGHT_STATE", type: bool }
  electrics.pdm_raw_byte_0: { from: "can0:haltech.PDM_INFO.PDM_DATA_BYTE_0", type: int }
  electrics.pdm_raw_byte_1: { from: "can0:haltech.PDM_INFO.PDM_DATA_BYTE_1", type: int }
  electrics.pdm_raw_byte_2: { from: "can0:haltech.PDM_INFO.PDM_DATA_BYTE_2", type: int }
  electrics.pdm_raw_byte_3: { from: "can0:haltech.PDM_INFO.PDM_DATA_BYTE_3", type: int }
  electrics.right_indicator: { from: "can0:haltech.VEHICLE_LIGHTS_DATA.RIGHT_INDICATOR_STATE", type: bool }
  electrics.wb1_battery_v: { from: "can0:wideband.WB1_LAMBDA.WB1_BATTERY_VOLTAGE", units: "V" }

  # ---- electrics.pd16.* -- PD16A power distribution module (device: haltech2, haltech-multiplexed.dbc) ----
  # PD16A_DIAGNOSTICS: ~2 Hz electrical-health telemetry (rail voltages, temps, total current).
  electrics.pd16.battery_v: { from: "can0:haltech2.PD16A_DIAGNOSTICS.PD16A_BATTERY_VOLTAGE", units: "V" }
  electrics.pd16.cpu_temp: { from: "can0:haltech2.PD16A_DIAGNOSTICS.PD16A_CPU_TEMP", units: "degC" }
  electrics.pd16.ignition_switch: { from: "can0:haltech2.PD16A_DIAGNOSTICS.PD16A_IGNITION_SWITCH", type: int }
  electrics.pd16.main_rail_temp: { from: "can0:haltech2.PD16A_DIAGNOSTICS.PD16A_MAIN_RAIL_TEMP", units: "degC" }
  electrics.pd16.main_rail_temp_status: { from: "can0:haltech2.PD16A_DIAGNOSTICS.PD16A_MAIN_RAIL_TEMP_STATUS", type: int }
  electrics.pd16.main_rail_v: { from: "can0:haltech2.PD16A_DIAGNOSTICS.PD16A_MAIN_RAIL_VOLTAGE", units: "V" }
  electrics.pd16.prot_rail_v: { from: "can0:haltech2.PD16A_DIAGNOSTICS.PD16A_PROT_RAIL_VOLTAGE", units: "V" }
  electrics.pd16.thermistor_1_temp: { from: "can0:haltech2.PD16A_DIAGNOSTICS.PD16A_THERMISTOR_1_TEMP", units: "degC" }
  electrics.pd16.thermistor_2_temp: { from: "can0:haltech2.PD16A_DIAGNOSTICS.PD16A_THERMISTOR_2_TEMP", units: "degC" }
  electrics.pd16.thermistor_3_temp: { from: "can0:haltech2.PD16A_DIAGNOSTICS.PD16A_THERMISTOR_3_TEMP", units: "degC" }
  electrics.pd16.total_current: { from: "can0:haltech2.PD16A_DIAGNOSTICS.PD16A_TOTAL_CURRENT", units: "A" }
  electrics.pd16.tvs_temp_status: { from: "can0:haltech2.PD16A_DIAGNOSTICS.PD16A_TVS_TEMP_STATUS", type: int }

  # PD16A_AVI_VOLTAGES / PD16A_SPI_VOLTAGES: ~100 Hz live analog inputs (AVI 1-4 are
  # analog sensors; SPI 3/4 are switched inputs wired as analog here). These are the
  # "noisy 100 Hz PD16 voltage channels" the RBE policy below exists for: a tight
  # deadband keeps the link quiet while steady, and max_interval guarantees a
  # heartbeat sample so Timescale fill-forward queries stay bounded even if the
  # signal never moves (e.g. an unused AVI input pinned at 0 V).
  electrics.pd16.avi1_state: { from: "can0:haltech2.PD16A_AVI_VOLTAGES.PD16A_AVI_1_STATE", type: int }
  electrics.pd16.avi1_v: { from: "can0:haltech2.PD16A_AVI_VOLTAGES.PD16A_AVI_1_VOLTAGE", units: "V", rbe: {deadband: 0.05, max_interval: 5s} }
  electrics.pd16.avi2_state: { from: "can0:haltech2.PD16A_AVI_VOLTAGES.PD16A_AVI_2_STATE", type: int }
  electrics.pd16.avi2_v: { from: "can0:haltech2.PD16A_AVI_VOLTAGES.PD16A_AVI_2_VOLTAGE", units: "V", rbe: {deadband: 0.05, max_interval: 5s} }
  electrics.pd16.avi3_state: { from: "can0:haltech2.PD16A_AVI_VOLTAGES.PD16A_AVI_3_STATE", type: int }
  electrics.pd16.avi3_v: { from: "can0:haltech2.PD16A_AVI_VOLTAGES.PD16A_AVI_3_VOLTAGE", units: "V", rbe: {deadband: 0.05, max_interval: 5s} }
  electrics.pd16.avi4_state: { from: "can0:haltech2.PD16A_AVI_VOLTAGES.PD16A_AVI_4_STATE", type: int }
  electrics.pd16.avi4_v: { from: "can0:haltech2.PD16A_AVI_VOLTAGES.PD16A_AVI_4_VOLTAGE", units: "V", rbe: {deadband: 0.05, max_interval: 5s} }
  electrics.pd16.spi3_state: { from: "can0:haltech2.PD16A_SPI_VOLTAGES.PD16A_SPI_3_STATE", type: int }
  electrics.pd16.spi3_v: { from: "can0:haltech2.PD16A_SPI_VOLTAGES.PD16A_SPI_3_VOLTAGE", units: "V", rbe: {deadband: 0.05, max_interval: 5s} }
  electrics.pd16.spi4_state: { from: "can0:haltech2.PD16A_SPI_VOLTAGES.PD16A_SPI_4_STATE", type: int }
  electrics.pd16.spi4_v: { from: "can0:haltech2.PD16A_SPI_VOLTAGES.PD16A_SPI_4_VOLTAGE", units: "V", rbe: {deadband: 0.05, max_interval: 5s} }

  # PD16A_OUTPUT_STATUS: ~5 Hz per-output monitoring (HCO25 1-4 = 25A high-current
  # outputs, HCO8 1-10 = 8A outputs, HBO 1-2 = H-bridge outputs). Multiplexed on the
  # wire (one mux group per output per frame); the catalog only cares about the
  # decoded per-output signals, not the mux mechanics.
  electrics.pd16.hbo_1_hs_current: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HBO_1_HS_CURRENT", units: "A" }
  electrics.pd16.hbo_1_load: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HBO_1_LOAD", units: "%" }
  electrics.pd16.hbo_1_pin_state: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HBO_1_PIN_STATE", type: int }
  electrics.pd16.hbo_1_retry_count: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HBO_1_RETRY_COUNT", type: int }
  electrics.pd16.hbo_1_v: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HBO_1_VOLTAGE", units: "V" }
  electrics.pd16.hbo_2_hs_current: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HBO_2_HS_CURRENT", units: "A" }
  electrics.pd16.hbo_2_load: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HBO_2_LOAD", units: "%" }
  electrics.pd16.hbo_2_pin_state: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HBO_2_PIN_STATE", type: int }
  electrics.pd16.hbo_2_retry_count: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HBO_2_RETRY_COUNT", type: int }
  electrics.pd16.hbo_2_v: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HBO_2_VOLTAGE", units: "V" }
  electrics.pd16.hco25_12_temp_status: { from: "can0:haltech2.PD16A_DIAGNOSTICS.PD16A_HCO25_12_TEMP_STATUS", type: int }
  electrics.pd16.hco25_1_hs_current: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_1_HS_CURRENT", units: "A" }
  electrics.pd16.hco25_1_load: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_1_LOAD", units: "%" }
  electrics.pd16.hco25_1_ls_current: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_1_LS_CURRENT", units: "A" }
  electrics.pd16.hco25_1_pin_state: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_1_PIN_STATE", type: int }
  electrics.pd16.hco25_1_retry_count: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_1_RETRY_COUNT", type: int }
  electrics.pd16.hco25_1_v: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_1_VOLTAGE", units: "V" }
  electrics.pd16.hco25_2_hs_current: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_2_HS_CURRENT", units: "A" }
  electrics.pd16.hco25_2_load: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_2_LOAD", units: "%" }
  electrics.pd16.hco25_2_ls_current: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_2_LS_CURRENT", units: "A" }
  electrics.pd16.hco25_2_pin_state: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_2_PIN_STATE", type: int }
  electrics.pd16.hco25_2_retry_count: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_2_RETRY_COUNT", type: int }
  electrics.pd16.hco25_2_v: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_2_VOLTAGE", units: "V" }
  electrics.pd16.hco25_34_temp_status: { from: "can0:haltech2.PD16A_DIAGNOSTICS.PD16A_HCO25_34_TEMP_STATUS", type: int }
  electrics.pd16.hco25_3_hs_current: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_3_HS_CURRENT", units: "A" }
  electrics.pd16.hco25_3_load: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_3_LOAD", units: "%" }
  electrics.pd16.hco25_3_ls_current: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_3_LS_CURRENT", units: "A" }
  electrics.pd16.hco25_3_pin_state: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_3_PIN_STATE", type: int }
  electrics.pd16.hco25_3_retry_count: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_3_RETRY_COUNT", type: int }
  electrics.pd16.hco25_3_v: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_3_VOLTAGE", units: "V" }
  electrics.pd16.hco25_4_hs_current: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_4_HS_CURRENT", units: "A" }
  electrics.pd16.hco25_4_load: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_4_LOAD", units: "%" }
  electrics.pd16.hco25_4_ls_current: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_4_LS_CURRENT", units: "A" }
  electrics.pd16.hco25_4_pin_state: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_4_PIN_STATE", type: int }
  electrics.pd16.hco25_4_retry_count: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_4_RETRY_COUNT", type: int }
  electrics.pd16.hco25_4_v: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO25_4_VOLTAGE", units: "V" }
  electrics.pd16.hco8_10_current: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO8_10_CURRENT", units: "A" }
  electrics.pd16.hco8_10_load: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO8_10_LOAD", units: "%" }
  electrics.pd16.hco8_10_pin_state: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO8_10_PIN_STATE", type: int }
  electrics.pd16.hco8_10_retry_count: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO8_10_RETRY_COUNT", type: int }
  electrics.pd16.hco8_10_v: { from: "can0:haltech2.PD16A_OUTPUT_STATUS.PD16A_HCO8_10_VOLTAGE", units: "V" }
