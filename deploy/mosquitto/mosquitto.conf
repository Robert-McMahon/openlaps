# Pit-local MQTT broker for the live-decoder's gauge feed.
#
# This is the only MQTT left in the system (docs/ARCHITECTURE.md). It never
# crosses the radio and it is disposable: every value on it is a live
# reading that is worthless a second later, and the pit database is where
# anything durable belongs.
#
# There is deliberately NO `connection` block anywhere in this file. A
# bridge is the one thing that could put this broker on the radio, and the
# absence of one is what makes that impossible rather than merely
# discouraged. If you find yourself adding a bridge, the data you want is
# already in Timescale.

# Plain MQTT for the live-decoder itself, which runs on the pit compose
# network.
listener 1883
protocol mqtt

# WebSockets for browsers -- the gauge consumers Phase 4's dashboards will
# use. Same broker, same topics, different transport.
listener 9001
protocol websockets

# Anonymous on a pit-local network with no bridge and no durable content.
# To lock it down, set `allow_anonymous false`, mount a password file here,
# and fill OPENLAPS_MQTT_USERNAME/PASSWORD in the pit .env -- the
# live-decoder already reads both.
allow_anonymous true

# Nothing here is worth persisting: every message is QoS 0 and
# non-retained, published by the live-decoder precisely because a stale
# live value is worse than none (the same reasoning ADR 0006 applies to
# RTCM). A restarted broker should come up empty.
persistence false
autosave_interval 0

# Bounded, and small: the live-decoder's own conflating limiter is the real
# flow control, and a broker-side backlog would only serve stale values to
# a reconnecting gauge.
max_queued_messages 100

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
