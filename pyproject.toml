[project]
name = "openlaps"
version = "0.1.0"
description = "Generic multi-CAN racing telemetry platform — the car is just an example configuration."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "aiomqtt>=2.3",
    "cantools>=42.0.3",
    "nats-py>=2.15.0",
    "protobuf>=5.28",
    "psutil>=7.2.2",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.13.4",
    "pyserial>=3.5",
    "python-can>=4.6.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
openlaps-agent = "agent.__main__:main"
openlaps-canlog = "collectors.canlog:main"
openlaps-migrate = "pit.db.__main__:main"
openlaps-ingest-writer = "pit.ingest_writer.__main__:main"
openlaps-ntrip-client = "pit.ntrip_client.__main__:main"
openlaps-live-decoder = "pit.live_decoder.__main__:main"
openlaps-timing-extrapolator = "pit.timing_extrapolator.__main__:main"
openlaps-session-control = "pit.session_control.__main__:main"
openlaps-pit-monitor = "pit.pit_monitor.__main__:main"
openlaps-notifier = "pit.notifier.__main__:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "pytest>=8.3",
    "pre-commit>=4.0",
    "grpcio-tools>=1.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/collectors",
    "src/core",
    "src/timing",
    "src/agent",
    "src/pit",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["src/core/pb/*_pb2.py", "src/core/pb/*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
