repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged secrets scan)
        entry: gitleaks protect --staged --verbose --redact
        language: system
        pass_filenames: false
