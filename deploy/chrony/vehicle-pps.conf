# Vehicle clock for a board with a kernel PPS device: the GNSS receiver's PPS
# wire goes straight to a GPIO, `pps-gpio` binds it, and chrony reads
# /dev/pps0 directly. Internet NTP remains ordinary fallback.
#
#     sudo install -m 0644 deploy/chrony/vehicle-pps.conf /etc/chrony/chrony.conf
#
# This is `vehicle.conf` with one line different. That file is for a board
# whose PPS arrives as *samples over a socket* -- the X4's RP2040 timing head
# through tools/timing_head_shim.py, or tools/pps_gpio_shim.py on a board with
# no PPS client in its kernel. Here the kernel does the capture, so there is
# no shim, no socket and no group/permission dance.
# `tests/test_timing_deploy.py` holds the two files' common lines in step.
pool pool.ntp.org iburst maxsources 4

# No `lock`: nothing on this board feeds chrony NMEA, so the coarse second --
# which second this edge *is* -- comes from the pool above. That is sound
# while those sources hold the clock inside +/-0.5 s, and it is the same
# assumption tools/pps_gpio_shim.py makes.
#
# `precision` is the driver's *resolution* claim -- sub-microsecond, since the
# edge is timestamped in the kernel's hard IRQ handler -- and not its jitter,
# which chrony estimates for itself. First measurement on a Luckfox Omni3576,
# idle, two minutes after start: offset +2.3 us, std dev 9.4 us. That is the
# idle figure on a PREEMPT_VOLUNTARY kernel; read `chronyc sourcestats` again
# under real load before quoting it at an event.
refclock PPS /dev/pps0 refid GPS precision 1e-6 prefer

# A cold SBC may have no RTC. Only early startup corrections may step;
# source loss/restoration after that is handled by chrony's normal slew.
makestep 1.0 3
rtcsync

# Continue serving the pit while free-running if every real source disappears.
local stratum 10
allow 192.168.12.0/24

driftfile /var/lib/chrony/drift
logdir /var/log/chrony
