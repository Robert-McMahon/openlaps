# Let the openlaps agent write to the chrony refclock socket that carries the
# receiver's time (deploy/chrony/vehicle-pps-nmea.conf). For Debian's
# chrony.service, whose ExecStart is `!/usr/sbin/chronyd $DAEMON_OPTS`;
# chrony-openlaps-sock.conf beside this file is the Ubuntu equivalent for the
# shims' socket.
#
#     sudo install -D -m 0644 deploy/systemd/chrony-openlaps-nmea.conf \
#         /etc/systemd/system/chrony.service.d/openlaps-nmea.conf
#
# chronyd creates a SOCK refclock's socket while it is still root, so the
# group it starts with and the umask decide who may send to it. /run/chrony
# itself stays chronyd's own; the socket gets a directory the agent's group
# can enter.
[Service]
ExecStartPre=+/usr/bin/install -d -m 0750 -o root -g openlaps /run/openlaps-chrony
ExecStart=
ExecStart=!/usr/bin/setpriv --regid=openlaps --clear-groups /usr/sbin/chronyd $DAEMON_OPTS
UMask=0117
