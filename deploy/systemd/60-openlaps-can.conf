# Let the agent size its CAN socket's receive buffer (collectors/can.py asks
# for 16 MB). The kernel caps any request at net.core.rmem_max, about 200 kB
# by default: a tenth of a second of a busy 1 Mbit/s bus. The reader is kept
# waiting longer than that many times a minute, and what does not fit is
# dropped by the kernel without touching any interface counter. On the
# luckfox that was 1 to 4 % of every channel. The agent logs a warning at
# start when it is granted less than it asked for, and counts the drops as
# sys.agent.socket_drops.<bus>.
#
# Install:  sudo install -m 0644 deploy/systemd/60-openlaps-can.conf /etc/sysctl.d/
# Apply:    sudo sysctl --system   (then restart openlaps-agent)
net.core.rmem_max = 16777216
