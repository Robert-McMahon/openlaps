# Vehicle nats-server: the producer side of the link.
#
# This server owns TELE and CMD (both created by the agent, not here -- see
# src/agent/publisher.py::_ensure_streams) and accepts the leafnode
# connection the pit dials in. It never dials out: docs/ARCHITECTURE.md
# requires that the vehicle need no inbound reachability *from* the pit LAN,
# which is satisfied by the pit being the one that initiates.

server_name: openlaps-vehicle

# Client port for the agent, which runs alongside on the SBC.
listen: 0.0.0.0:4222

jetstream {
  # The domain is half of a two-part contract. Cross-domain addressing over
  # the leafnode names it explicitly: the pit sources TELE via
  # "$JS.veh.API", and session-control publishes with
  # nc.jetstream(domain="veh"). Both must equal this string.
  #
  # The other half is OPENLAPS_VEHICLE_JS_DOMAIN in the pit's .env (default
  # "veh", read by SessionControlSettings.from_env). A mismatch is a silent
  # failure: the publish goes to a domain that does not exist and simply
  # times out, with nothing wrong-looking in either server's log.
  domain: veh

  # A real directory with room for TELE's max_bytes (8 GiB by default, see
  # OPENLAPS_TELE_MAX_BYTES). Bench lesson: on a tmpfs or an anonymous
  # volume the server reports far less space than the stream asks for and
  # stream creation fails with err 10047 ("insufficient storage resources"),
  # which reads like a permissions problem and is not.
  store_dir: /data

  # Headroom above the stream's own cap for CMD, indexes and the write-ahead
  # state. Raise together with OPENLAPS_TELE_MAX_BYTES.
  max_file_store: 12GB
  max_memory_store: 256MB
}

# The pit connects here. Nothing else does.
leafnodes {
  listen: 0.0.0.0:7422

  tls {
    cert_file: "/etc/nats/tls/server-cert.pem"
    key_file:  "/etc/nats/tls/server-key.pem"
    ca_file:   "/etc/nats/tls/ca.pem"
    # The pit presents a client certificate; an unauthenticated dialler is
    # rejected at the TLS layer before it can attempt an account login.
    verify: true
    timeout: 5
  }

  authorization {
    # Credentials are per-deployment and live only in the mounted file --
    # see deploy/nats/README.md. Generate a fresh password per car.
    user: leaf
    password: $NATS_LEAF_PASSWORD
    timeout: 5
  }
}

# The agent's own connection. Left unauthenticated because this listener is
# reachable only from the SBC itself in the deployed topology; if the
# vehicle's client port is ever exposed beyond the car, add an
# `authorization` block here and set OPENLAPS_NATS_CREDS on the agent.

max_payload: 8MB

# Bench observability: `nats-server --signal ldm` and the monitoring port
# both help when the link is misbehaving. This is a private network.
http: 0.0.0.0:8222

debug: false
trace: false
logtime: true
