# Vehicle stack: nats-server + the agent, on the car's SBC.
#
#     docker compose -f deploy/vehicle-compose.yaml up -d
#
# Run it from the repository root with a `.env` beside this file (see
# example.env). `deploy/systemd/openlaps-agent.service` is the alternative
# for an SBC running the agent directly, which is what the bench does today.
#
# Both services use host networking, and that is not a shortcut. `can0` is a
# SocketCAN *network interface*: there is no device node to pass through, so
# the container has to share the host's network namespace to see it. Bring
# the interface up on the host first -- the agent does not configure it:
#
#     sudo ip link set can0 up type can bitrate 1000000
#
# Host networking also means the ports below are the host's ports directly;
# there is no port mapping to get wrong.

name: openlaps-vehicle

services:
  nats:
    image: nats:2.12-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    network_mode: host
    volumes:
      - ./nats/vehicle.conf:/etc/nats/nats.conf:ro
      # TLS material and the JetStream store both come from outside the
      # repository. The store must be a real directory with room for
      # OPENLAPS_TELE_MAX_BYTES -- a small or memory-backed one makes
      # stream creation fail with err 10047. See deploy/nats/README.md.
      - ${NATS_TLS_DIR:?set NATS_TLS_DIR in .env}:/etc/nats/tls:ro
      - ${NATS_STORE_DIR:-/var/lib/openlaps/nats}:/data
    environment:
      # Expanded by nats-server itself inside vehicle.conf.
      NATS_LEAF_PASSWORD: ${NATS_LEAF_PASSWORD:?set NATS_LEAF_PASSWORD in .env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  agent:
    image: ${OPENLAPS_IMAGE:-openlaps:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["openlaps-agent"]
    network_mode: host
    devices:
      # The GPS receiver, as /dev/ttyACM0 -- the RP2040 relay (ADR 0009),
      # not an external USB-serial adapter. The container path stays
      # ttyUSB0 so the profile does not encode the host's wiring. An
      # external adapter (the pre-0009 arrangement, and still the
      # fallback) enumerates as ttyUSB0 and can be named unstably when it
      # re-enumerates, which is worth a udev rule if you go back to it.
      - ${OPENLAPS_SERIAL_DEVICE:-/dev/ttyUSB0}:/dev/ttyUSB0
    group_add:
      # Serial devices are group-owned by `dialout` on Debian-family hosts;
      # without this the agent opens the port and gets EACCES.
      - ${OPENLAPS_DIALOUT_GID:-20}
    env_file:
      - .env
    environment:
      # The local server for *this* stack -- the one in this file. With host
      # networking that is genuinely loopback.
      OPENLAPS_NATS_URL: ${OPENLAPS_NATS_URL:-nats://127.0.0.1:4222}
      OPENLAPS_PROFILE: /app/profiles/${OPENLAPS_PROFILE_NAME:-example-club-racer}
      # Registry and session state are written here rather than beside the
      # profile, because the profile is mounted read-only and this has to
      # survive the container.
      OPENLAPS_STATE_DIR: /var/lib/openlaps/agent
    volumes:
      - ../profiles:/app/profiles:ro
      - agent-state:/var/lib/openlaps/agent
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  # The in-car camera (docs/LINK_BUDGET.md §5 reserves the headroom; the
  # predecessor stack ran the same encoder). Opt-in by compose profile
  # because a bench SBC without a camera plugged in cannot start a container
  # that maps /dev/video0:
  #
  #     docker compose -f deploy/vehicle-compose.yaml --profile video up -d
  #
  # The pit consumes this directly -- the operator's browser opens
  # http://<vehicle-host>:1984/stream.html?src=car (embedded in the `video`
  # Grafana dashboard). That is a second pit->vehicle crossing beside the
  # leafnode, in the same direction: the pit still dials the vehicle, and
  # the car still needs no inbound reachability *initiated from beyond* the
  # pit LAN. Video bytes never touch NATS; a dead camera cannot cost
  # telemetry anything except the airtime it stops using.
  go2rtc:
    # Pinned like every other image here. The `-hardware` variant carries
    # the Intel VAAPI drivers the encode pipeline in go2rtc/go2rtc.yaml
    # names; the plain image would fall back to CPU encode on an SBC that
    # is also running the agent.
    image: alexxit/go2rtc:${GO2RTC_IMAGE_TAG:-1.9.14-hardware}
    # Host networking for the same reason as the servers above -- and
    # WebRTC negotiates ephemeral UDP, which port mapping handles badly.
    network_mode: host
    devices:
      - ${OPENLAPS_VIDEO_DEVICE:-/dev/video0}:/dev/video0
      # The iGPU, for VAAPI encode.
      - /dev/dri:/dev/dri
      # ALSA capture for cabin audio. Present on the bench SBC; if a build
      # has no audio device, drop this line and the audio producer simply
      # fails per-request while video keeps working.
      - /dev/snd:/dev/snd
    volumes:
      # Read-only: the repository is the source of truth for the stream
      # definitions, same discipline as the Grafana provisioning mounts.
      # go2rtc only writes its config when edited through its web UI, which
      # this mount deliberately makes impossible.
      - ./go2rtc:/config:ro
    profiles: ["video"]
    restart: unless-stopped

volumes:
  agent-state:
