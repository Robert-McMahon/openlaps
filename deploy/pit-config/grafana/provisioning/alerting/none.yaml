# No alerting rules are provisioned yet, and this file exists to say so.
#
# The directory itself has to exist: deploy/pit-compose.yaml mounts
# ../provisioning over /etc/grafana/provisioning, replacing the four
# directories the image ships, and Grafana logs an error for each one it
# cannot open. An empty directory is not enough either -- Grafana warns
# about any file here whose suffix is not .yaml/.yml/.json, so a .gitkeep
# trades one confusing log line for another. A valid, empty provisioning
# document is the quiet option.
apiVersion: 1
