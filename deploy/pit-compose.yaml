# Pit stack: nats-server, TimescaleDB, mosquitto, Grafana, and the seven pit
# services.
#
#     docker compose -f deploy/pit-compose.yaml up -d
#
# Bring-up order is expressed in `depends_on`, not in a runbook, so `up -d`
# gets it right unattended:
#
#   timescaledb healthy -> migrate runs to completion -> DB services start
#   nats healthy -> provision-streams runs to completion -> NATS consumers start
#
# The two one-shots are the interesting part. Migrations are a bring-up
# *step*, not a service: modelling them as an entrypoint line in each of the
# four services would have four containers racing the same DDL on every
# restart. Likewise the sourced stream is created once, by one thing.

name: openlaps-pit

x-openlaps-image: &openlaps-image
  image: ${OPENLAPS_IMAGE:-openlaps:local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile

x-pit-env: &pit-env
  env_file:
    - .env

services:
  # --- infrastructure -------------------------------------------------------

  nats:
    image: nats:2.12-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ./nats/pit.conf:/etc/nats/nats.conf:ro
      - ${NATS_TLS_DIR:?set NATS_TLS_DIR in .env}:/etc/nats/tls:ro
      - nats-data:/data
    environment:
      # The whole leafnode remote URL, as one variable — nats-server expands
      # $VAR only as a complete token, never as a substring, so pit.conf
      # cannot assemble this from parts. Embed the vehicle stack's
      # NATS_LEAF_PASSWORD and the car's address (which must match its
      # certificate's SAN):
      #     NATS_LEAFNODE_URL=tls://leaf:<password>@<vehicle-host>:7422
      NATS_LEAFNODE_URL: ${NATS_LEAFNODE_URL:?set NATS_LEAFNODE_URL in .env}
    ports:
      - "4222:4222"   # clients (tools/decode.py, the nats CLI)
      - "8222:8222"   # monitoring: /healthz, /leafz, /jsz
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_DB: ${TIMESCALE_DB:-openlaps}
      POSTGRES_USER: ${TIMESCALE_USER:-openlaps}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:?set TIMESCALE_PASSWORD in .env}
    volumes:
      - timescale-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      # `pg_isready` alone reports ready during first-time init, before the
      # server's restart partway through it. A completed query does not.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -q"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"   # live-decoder and mosquitto_sub
      - "9001:9001"   # websockets, for browser gauges
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/#' -C 1 -W 3 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --- one-shot bring-up steps ----------------------------------------------

  migrate:
    <<: [*openlaps-image, *pit-env]
    command: ["openlaps-migrate"]
    environment:
      TIMESCALE_HOST: ${TIMESCALE_HOST:-timescaledb}
      TIMESCALE_PORT: "5432"
    depends_on:
      timescaledb:
        condition: service_healthy
    # Safe to re-run: the applier records applied versions and serialises on
    # an advisory lock (docs/PIT_SCHEMA.md). It exits 0 with nothing to do.
    restart: "no"

  provision-streams:
    <<: [*openlaps-image, *pit-env]
    command: ["python", "/app/deploy/provision_pit_streams.py"]
    environment:
      OPENLAPS_NATS_URL: ${OPENLAPS_NATS_URL:-nats://nats:4222}
    depends_on:
      nats:
        condition: service_healthy
    # Idempotent: creates TELE_VEHICLE or converges the existing one.
    restart: "no"

  # --- pit services ---------------------------------------------------------

  ingest-writer:
    <<: [*openlaps-image, *pit-env]
    command: ["openlaps-ingest-writer"]
    environment:
      OPENLAPS_NATS_URL: ${OPENLAPS_NATS_URL:-nats://nats:4222}
      OPENLAPS_INGEST_STREAM: ${OPENLAPS_INGEST_STREAM:-TELE_VEHICLE}
      OPENLAPS_INGEST_HEALTH_PORT: "8081"
      TIMESCALE_HOST: ${TIMESCALE_HOST:-timescaledb}
      TIMESCALE_PORT: "5432"
    ports:
      - "8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      provision-streams:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  live-decoder:
    <<: [*openlaps-image, *pit-env]
    command: ["openlaps-live-decoder"]
    environment:
      OPENLAPS_NATS_URL: ${OPENLAPS_NATS_URL:-nats://nats:4222}
      OPENLAPS_LIVE_STREAM: ${OPENLAPS_LIVE_STREAM:-TELE_VEHICLE}
      OPENLAPS_LIVE_CONFIG: /config/live/live-decoder.yaml
      OPENLAPS_LIVE_HEALTH_PORT: "8082"
      OPENLAPS_MQTT_HOST: mosquitto
      OPENLAPS_MQTT_PORT: "1883"
    volumes:
      # A bind mount of the *directory*, not of the single file. The reload
      # path is an mtime poll plus SIGHUP, and most editors save by writing
      # a temporary file and renaming it over the original -- which changes
      # the inode. A single-file bind would keep pointing at the old one and
      # the edit would never be seen.
      - ./pit-config:/config/live:ro
    ports:
      - "8082:8082"
    depends_on:
      provision-streams:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  timing-extrapolator:
    <<: [*openlaps-image, *pit-env]
    command: ["openlaps-timing-extrapolator"]
    environment:
      OPENLAPS_NATS_URL: ${OPENLAPS_NATS_URL:-nats://nats:4222}
      OPENLAPS_TIMING_STREAM: ${OPENLAPS_TIMING_STREAM:-TELE_VEHICLE}
      OPENLAPS_TIMING_CONFIG: /config/timing-extrapolator.yaml
      OPENLAPS_TIMING_HEALTH_PORT: "8084"
      OPENLAPS_MQTT_HOST: mosquitto
      OPENLAPS_MQTT_PORT: "1883"
      OPENLAPS_VEHICLE_ID: ${OPENLAPS_VEHICLE_ID:-example-club-racer}
    volumes:
      - ./pit-config:/config:ro
    ports:
      - "8084:8084"
    depends_on:
      provision-streams:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8084/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  session-control:
    <<: [*openlaps-image, *pit-env]
    command: ["openlaps-session-control"]
    environment:
      # Publishes *across* the leafnode into the vehicle's JetStream domain,
      # so this URL is still the pit's own server. The domain below must
      # equal `jetstream { domain: ... }` in deploy/nats/vehicle.conf; a
      # mismatch is a silent publish failure into a domain that does not
      # exist.
      OPENLAPS_NATS_URL: ${OPENLAPS_NATS_URL:-nats://nats:4222}
      OPENLAPS_VEHICLE_JS_DOMAIN: ${OPENLAPS_VEHICLE_JS_DOMAIN:-veh}
      # A container has to bind 0.0.0.0 to be reachable at all, and
      # SessionControlSettings.from_env refuses to start on a non-loopback
      # bind without an API key. The key is therefore mandatory here, not
      # something to discover at first bring-up.
      OPENLAPS_SESSION_HOST: 0.0.0.0
      OPENLAPS_SESSION_API_KEY: ${OPENLAPS_SESSION_API_KEY:?set OPENLAPS_SESSION_API_KEY in .env}
      OPENLAPS_SESSION_PORT: "8080"
      OPENLAPS_SESSION_STATE_FILE: /data/session-state.json
      OPENLAPS_SESSION_ROSTER: /config/roster.json
      TIMESCALE_HOST: ${TIMESCALE_HOST:-timescaledb}
      TIMESCALE_PORT: "5432"
    volumes:
      # Restart continuity depends on the state file outliving the
      # container: on startup the service re-publishes what it finds here,
      # re-asserting the current session to a vehicle that may have
      # restarted too.
      - session-data:/data
      - ${OPENLAPS_ROSTER_FILE:-../profiles/example-club-racer/session-roster.json}:/config/roster.json:ro
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  notifier:
    # Grafana's only contact point (ADR 0011). Records every alert in the
    # ledger, serves the annunciator on :8085, repeats unacknowledged
    # critical alerts, and fans out to phones (P7.3). The webhook is
    # unauthenticated by design -- the compose network is the boundary and a
    # committed provisioning file must not carry a credential -- and what an
    # unauthenticated caller can do is raise an alert on a page whose job is
    # to show alerts.
    <<: [*openlaps-image, *pit-env]
    command: ["openlaps-notifier"]
    environment:
      OPENLAPS_NOTIFIER_HOST: 0.0.0.0
      OPENLAPS_NOTIFIER_PORT: "8085"
      OPENLAPS_NOTIFIER_CONFIG: /config/notifier.yaml
      OPENLAPS_VEHICLE_ID: ${OPENLAPS_VEHICLE_ID:-example-club-racer}
      TIMESCALE_HOST: ${TIMESCALE_HOST:-timescaledb}
      TIMESCALE_PORT: "5432"
    volumes:
      - ./pit-config:/config:ro
    ports:
      - "8085:8085"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8085/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  ntrip-client:
    <<: [*openlaps-image, *pit-env]
    command: ["openlaps-ntrip-client"]
    environment:
      OPENLAPS_NATS_URL: ${OPENLAPS_NATS_URL:-nats://nats:4222}
      # Only read when NTRIP_ENABLE_GGA=1, but it costs nothing to set and
      # the GGA feed fails at startup without it against a sourced stream.
      OPENLAPS_NTRIP_STREAM: ${OPENLAPS_NTRIP_STREAM:-TELE_VEHICLE}
      OPENLAPS_NTRIP_HEALTH_PORT: "8083"
    ports:
      - "8083:8083"
    depends_on:
      provision-streams:
        condition: service_completed_successfully
    # NTRIP_HOST and NTRIP_MOUNTPOINT are required; without them the service
    # exits 2 at startup and restarts, which is the intended loud failure.
    # If you are not running RTK, `docker compose ... stop ntrip-client`.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  pit-monitor:
    <<: [*openlaps-image, *pit-env]
    command: ["openlaps-pit-monitor"]
    # The one pit service on the host network namespace, and the reason is
    # its subject: this service reports on *the pit host*, not on the compose
    # network. Two things need it.
    #
    #   chronyc has to reach the host's chronyd on 127.0.0.1:323. The vehicle
    #   agent already does exactly this (deploy/Dockerfile) -- it is why
    #   chrony is in the runtime image at all -- and a chronyd bound to
    #   localhost is not reachable from a bridge network by any other means
    #   short of mounting its socket.
    #
    #   psutil has to see the host's CPU, load, memory, interfaces and
    #   temperatures. Most of /proc is not namespaced so a bridged container
    #   would get these right by accident, but the network counters would be
    #   the container's own and read as a permanently idle pit.
    #
    # It also puts the ntrip-client's :8083 and NATS's :8222 on 127.0.0.1 via
    # the ports those services already publish, so nothing new is exposed.
    network_mode: host
    volumes:
      # Read-only, and only so `disk_usage` measures the pit's real root
      # filesystem: a container's own `/` is the image overlay, which is
      # neither the disk Timescale is filling nor one anybody can act on.
      # Narrow this to a specific mount point (and set the DISK_PATH below to
      # match) if the pit host keeps its data somewhere other than `/`.
      - /:/hostfs:ro
    environment:
      # Compose DNS does not exist on the host network, so the database is
      # the address timescaledb publishes rather than the service name every
      # other service here uses. A TIMESCALE_DSN set in .env would override
      # this and name `timescaledb`, which resolves nowhere from here, so it
      # is cleared for this service alone -- TIMESCALE_DB/USER/PASSWORD from
      # .env still apply. A pit that needs the DSN escape hatch (TLS, a
      # socket) sets this service's own value here instead of clearing it.
      TIMESCALE_HOST: ${TIMESCALE_LOCAL_HOST:-127.0.0.1}
      TIMESCALE_PORT: "5432"
      TIMESCALE_DSN: ""
      OPENLAPS_PIT_MONITOR_HEALTH_PORT: "8085"
      OPENLAPS_PIT_MONITOR_INTERVAL_S: ${OPENLAPS_PIT_MONITOR_INTERVAL_S:-5}
      OPENLAPS_PIT_MONITOR_DISK_PATH: /hostfs
      OPENLAPS_PIT_MONITOR_NTRIP_URL: ${OPENLAPS_PIT_MONITOR_NTRIP_URL:-http://127.0.0.1:8083/health}
      OPENLAPS_PIT_MONITOR_NATS_URL: ${OPENLAPS_PIT_MONITOR_NATS_URL:-http://127.0.0.1:8222}
    # No `ports:` -- host networking publishes :8085 directly. The ntrip and
    # NATS probes are best-effort by design (a pit not running RTK stops the
    # ntrip-client on purpose), so neither is a `depends_on`; only the schema
    # this service writes into is.
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8085/health"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  # --- read surface ---------------------------------------------------------

  grafana:
    # Pinned, never `latest`. A Grafana minor bump can change panel schema,
    # and discovering that from a restart in the pit lane is not a thing
    # anyone should do. Bump this deliberately, in a commit, with the
    # dashboards re-checked afterwards.
    image: grafana/grafana:${GRAFANA_IMAGE_TAG:-12.4.9}
    # No `env_file` here, unlike every openlaps service above, and that is
    # the point rather than an oversight. The pit's .env holds
    # TIMESCALE_PASSWORD -- the owner role the services write with -- and
    # Grafana must never see it. Listing each variable explicitly means the
    # only database credential this container can possibly hold is the
    # read-only one, structurally, not by convention.
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Absolute links -- share URLs, the login redirect -- are built from
      # this. Left at localhost they are unusable from any other machine on
      # the pit LAN, which is every machine that matters.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      # Every plugin this stack asks for is listed here with an exact version
      # pin. Phase 6 lifts the old single-plugin cap but keeps the deployment
      # discipline: downloads happen at first start and then live in the named
      # volume, so an offline pit only needs to have been online once before
      # the event. The dashboard contract derives its plugin allowlist from
      # this value rather than maintaining a second hard-coded list.
      #
      # _SYNC, not the plain `preinstall`, and not the `GF_INSTALL_PLUGINS`
      # the brief names: that variable is deprecated in Grafana 12 and is now
      # a no-op unless GF_INSTALL_PLUGINS_FORCE is also set. The synchronous
      # list is the right one regardless -- it installs *before* provisioning
      # runs, so the mqtt-live datasource is never provisioned against a
      # plugin that has not landed yet, and a failed install is loud instead
      # of leaving a red datasource to explain later.
      #
      # Grafana 12 additionally preinstalls its own drilldown apps
      # asynchronously and offers no supported way to decline them without
      # also declining this one. They are part of what the pinned image is,
      # not something this stack asked for.
      #
      # innius-video-panel earns its slot because core Grafana cannot embed
      # the car camera at all: the text panel strips iframes (HTML
      # sanitization, a global switch this stack will not flip), and no core
      # panel plays a live MSE/WebRTC stream. The `video` dashboard is its
      # only consumer.
      # Alert evaluation floor. Grafana defaults both to 10 s and rounds every
      # rule group's interval up to them, which put a threshold crossing
      # 25-50 s from a phone once `for` and group_wait were added. The
      # generated rules (tools/gen_alert_rules.py) evaluate every 2 s; the
      # floor has to agree or the file's interval is quietly ignored. Each
      # evaluation is one indexed last-sample query per rule, so the cost
      # at 2 s is a few queries a second. Verified on the bench per
      # docs/BENCH_RUNBOOK.md -> alert firing drill; the tick interval is
      # thinly documented and is the one to suspect if rules still
      # evaluate at 10 s.
      GF_UNIFIED_ALERTING_MIN_INTERVAL: 2s
      GF_UNIFIED_ALERTING_SCHEDULER_TICK_INTERVAL: 2s
      GF_PLUGINS_PREINSTALL_SYNC: grafana-mqtt-datasource@${GRAFANA_MQTT_PLUGIN_VERSION:-1.1.0},grafana-clock-panel@${GRAFANA_CLOCK_PLUGIN_VERSION:-3.2.4},innius-video-panel@${GRAFANA_VIDEO_PLUGIN_VERSION:-1.0.7}
      # Read by the provisioning YAML, which Grafana interpolates at load.
      # No password among them but the read-only one.
      TIMESCALE_HOST: ${TIMESCALE_HOST:-timescaledb}
      TIMESCALE_PORT: "5432"
      TIMESCALE_DB: ${TIMESCALE_DB:-openlaps}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana_ro}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      # Datasources and the dashboard provider. Read-only: provisioning is a
      # thing Grafana reads, never writes. The `plugins/` and `alerting/`
      # subdirectories carry nothing and exist anyway: this mount *replaces*
      # the four directories the image ships, and Grafana logs a red error
      # for each one it cannot open -- two red herrings at every bring-up
      # otherwise.
      - ./pit-config/grafana/provisioning:/etc/grafana/provisioning:ro
      # The dashboards themselves, mounted over a subdirectory of the volume
      # above at the path the provider names. Read-only here as well as
      # `allowUiUpdates: false` in the provider -- the repository is the
      # source of truth and the browser is not.
      - ./pit-config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
      # The Timescale datasource connects as the read-only role that
      # migration 002 creates, so a Grafana that starts before the migrator
      # has run shows a red datasource and an empty dashboard rather than an
      # error anyone can act on. Bring-up order belongs in `depends_on`.
      migrate:
        condition: service_completed_successfully
      mosquitto:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      # The alpine image carries busybox wget but no curl, so this differs
      # from the openlaps services' healthchecks above. /api/health needs no
      # authentication and reports the database and version.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # First start downloads and unpacks a plugin.
      start_period: 60s

volumes:
  nats-data:
  timescale-data:
  session-data:
  grafana-data:
