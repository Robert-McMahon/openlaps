# Pit nats-server: the consumer side of the link.
#
# This server owns TELE_VEHICLE -- a *sourced-only* copy of the vehicle's
# TELE, created by deploy/provision_pit_streams.py, not by this file. It
# dials the vehicle's leafnode listener. The vehicle must therefore be
# reachable from the pit network on port 7422; NAT needs explicit forwarding.

server_name: openlaps-pit

# Client port for pit services and local tools.
listen: 0.0.0.0:4222

jetstream {
  # Distinct from the vehicle's "veh". Two servers sharing one domain
  # cannot address each other's JetStream at all; that is the whole point
  # of the pair.
  domain: pit

  store_dir: /data

  # The pit stream is a *buffer*, not the archive -- Timescale is the
  # archive (ADR 0003). Its age cap still has to be at least the vehicle's
  # 72 h, or a pit outage re-pulls archived data as duplicates: see the
  # max_bytes/max_age reasoning in deploy/provision_pit_streams.py. The
  # file store below must hold that window at the vehicle's publish rate.
  max_file_store: 40GB
  max_memory_store: 256MB
}

leafnodes {
  remotes: [
    {
      # Each URL is one variable, and it has to be: nats-server expands
      # $VAR only when it is an entire token, never as a substring.
      # `tls://leaf:$NATS_LEAF_PASSWORD@$NATS_VEHICLE_HOST:7422` -- quoted
      # or not -- is dialled *literally*, and the server logs
      # `lookup $NATS_VEHICLE_HOST: no such host`, which reads like a DNS
      # problem and is a config-interpolation problem. Verified against
      # nats-server 2.12.
      #
      # Set them in the pit's .env as:
      #     NATS_LEAFNODE_URL=tls://leaf:<password>@<vehicle-host>:7422
      #     NATS_LEAFNODE_URL_ALT=tls://leaf:<password>@<other-address>:7422
      #
      # The password must equal the vehicle's $NATS_LEAF_PASSWORD, and each
      # host must match the vehicle certificate's SAN. Credentials go in the
      # URL because a leafnode remote has no separate user/password fields.
      #
      # Two addresses for one car: the first is tried first, and after a
      # disconnect the server moves to the next and wraps round. With a car
      # that has two links (HaLow LAN and Starlink), put the address that
      # follows the car across both first -- a Tailscale address does, and
      # keeps the TCP connection alive through the switch -- and the plain
      # LAN address second, so the pit still reaches the car if the tunnel
      # is down. NATS_LEAFNODE_URL_ALT defaults to the first URL in
      # pit-compose.yaml, which makes a single-address setup a no-op.
      urls: [$NATS_LEAFNODE_URL, $NATS_LEAFNODE_URL_ALT]
      no_randomize: true

      tls {
        cert_file: "/etc/nats/tls/client-cert.pem"
        key_file:  "/etc/nats/tls/client-key.pem"
        ca_file:   "/etc/nats/tls/ca.pem"
        # Handshake budget over a radio that is still lossy when the
        # reconnect lands; matches the vehicle's leafnode tls timeout.
        timeout: 10
      }
    }
  ]
}

max_payload: 8MB

# Link liveness. The pit mostly listens on the leafnode connection, so when
# the radio dies silently nothing here fails until a PING goes unanswered;
# at the default 2 min x 3 that is up to 6 minutes of believing the car is
# connected after it stopped being so. 10 s x 3 bounds it near 30 s. The
# vehicle side sets the same (deploy/nats/vehicle.conf).
ping_interval: "10s"
ping_max: 2

http: 0.0.0.0:8222

debug: false
trace: false
logtime: true
